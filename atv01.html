<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PWEB1 — Cap. 05 — AT01 — Formulário de Contato Simples</title>
</head>
<body>

  <header>
    <h1>Fale Conosco</h1>
    <p><a href="../index.html">← Voltar para a página principal</a></p>
  </header>

  <main>
    <form action="https://httpbin.org/get" method="get">
        
        <p>
            <label for="txt-nome">Nome Completo:</label>
            <input type="text" id="txt-nome" name="nome">
        </p>

        <p>
            <label for="txt-email">E-mail:</label>
            <input type="email" id="txt-email" name="email">
        </p>

        <p>
            <label for="txt-assunto">Assunto:</label>
            <input type="text" id="txt-assunto" name="assunto">
        </p>

        <p>
            <label for="txt-mensagem">Mensagem:</label>
            <br>
            <textarea id="txt-mensagem" name="mensagem" rows="5"></textarea>
        </p>

        <p>
            <button type="submit">Enviar mensagem</button>
        </p>

    </form>
  </main>

</body>
</html>
