<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Contato Simples</title>
    <style>
        /* Estilização básica apenas para organização visual dos campos */
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Fale Conosco</h1>

    <form action="https://httpbin.org/get" method="get">
        
        <div class="form-group">
            <label sorted for="txt-nome">Nome Completo:</label>
            <input type="text" id="txt-nome" name="nome" required>
        </div>

        <div class="form-group">
            <label for="txt-email">E-mail:</label>
            <input type="email" id="txt-email" name="email" required>
        </div>

        <div class="form-group">
            <label for="txt-assunto">Assunto:</label>
            <input type="text" id="txt-assunto" name="assunto" required>
        </div>

        <div class="form-group">
            <label for="txt-mensagem">Mensagem:</label>
            <textarea id="txt-mensagem" name="mensagem" rows="5" required></textarea>
        </div>

        <button type="submit">Enviar mensagem</button>

    </form>

</body>
</html>
